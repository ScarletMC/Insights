messages:
  prefix: '<aqua><bold>ʟɪᴍɪᴛᴀᴛᴏʀᴇ <dark_gray>»<reset> '
  update-available: '<prefix><dark_aqua>La versione <green><version> <dark_aqua>di
    <aqua>Insights <dark_aqua>è ora disponibile! Info: <aqua><body>'
  configs-reloaded: <prefix><dark_aqua>Tutte le configurazioni sono state ricaricate!
  area-scan-started: <prefix><dark_aqua>Attendi mentre scansioniamo questo/a <area>...
  area-scan-queued: <prefix><red>Questo/a <area> è attualmente in coda per la scansione...
  area-scan-completed: <actionbar><aqua>Scansione completata!
  limit-reached: <prefix><red>Hai raggiunto il limite di <limit>x in questo/a <area>.
    Rimuovine alcuni.
  limit-disallowed-placement: <prefix><red>Non puoi piazzarne in questo/a <area>!
  limit-notification: '<dark_aqua><name>: <aqua><count><dark_aqua>/<aqua><limit>'
  scan:
    start: <prefix><dark_aqua>Scansione di <aqua><bold><count></bold><dark_aqua> chunk
      in corso...
    already-scanning: <prefix><red>Attendi il termine dell''altra scansione prima
      di richiederne un''altra.
    finish:
      header: <dark_gray><strikethrough>----------------=<reset><dark_gray>[<aqua><bold>
        Scansione Insights<reset> <dark_gray>]<strikethrough>=---------------
      chunk-format: <dark_aqua>Chunk <aqua><world><dark_aqua> @ <aqua><chunk-x><dark_aqua>,
        <aqua><chunk-z>
      chunk-hover: <dark_aqua>Clicca per teletrasportarti!
      format: '<aqua> <entry><dark_gray>: <gray><bold><count>'
      footer: <dark_aqua> Scansionati un totale di <aqua><bold><chunks></bold> <dark_aqua>chunk
        con un totale di <aqua><bold><blocks></bold> <dark_aqua>blocchi e <aqua><bold><entities></bold>
        <dark_aqua>entità. Impiegato <aqua><time><dark_aqua>!
    progress: '<dark_aqua>Progresso: <aqua><bold><count></bold><dark_aqua>/<aqua><bold><total></bold>
      <dark_aqua>Chunk (<aqua><bold><percentage></bold>%<dark_aqua>)'
  scanregion:
    no-region: <prefix><red>Non sembra esserci alcuna regione qui!
  scancache:
    no-cache: <prefix><red>Non sembra esserci alcuna cache presente qui!
    cleared: <prefix><dark_aqua>La cache da questa <aqua><area><dark_aqua> è stata
      eliminata!
    result:
      header: <dark_gray><strikethrough>---------------=<reset><dark_gray>[<aqua><bold>
        Cache Insights<reset> <dark_gray>]<strikethrough>=---------------
      format: '<aqua> <entry><dark_gray>: <gray><bold><count>'
      footer: <dark_aqua> Risultato in cache da questa <aqua><area><dark_aqua>.
  stats: |-
    <dark_gray><strikethrough>---------------=<reset><dark_gray>[<aqua><bold> Statistiche Insights<reset> <dark_gray>]<strikethrough>=---------------
    <dark_aqua> Chunk Scansionati<dark_gray>: <aqua><bold><chunks_scanned></bold>
    <dark_aqua> Blocchi Scansionati<dark_gray>: <aqua><bold><blocks_scanned></bold>
    <dark_aqua> Dimensione Coda Attuale<dark_gray>: <aqua><bold><queue_size></bold>
    <dark_gray><strikethrough>-------------------------------------------------
  teleportchunk:
    error: <prefix><red>Si è verificato un errore, controlla la console.
    not-generated: <prefix><red>Impossibile teletrasportarti in quel chunk, non è
      ancora stato generato. Usa il flag <dark_red>--generate <red>per forzare.
    failed: <prefix><red>Teletrasporto fallito per motivi sconosciuti, forse la console
      contiene uno stacktrace?
    success: <prefix><dark_aqua>Teletrasportato al chunk <aqua><world> <dark_aqua>@
      <aqua><chunk-x><dark_aqua>, <aqua><chunk-z><dark_aqua>!
  cancelscan:
    no-scan: <prefix><red>Non hai una scansione attiva da annullare!
  scanhistory:
    no-history: <prefix><red>Non sembra che tu abbia alcuna cronologia di scansioni!
  pagination:
    button-left: <<<
    button-right: '>>>'
    button-color-active: <aqua>
    button-color-inactive: <gray>
    button-hover: <gray>Clicca per andare alla pagina <aqua><page><gray>!
    footer-format: <dark_gray><strikethrough>-------------=<reset><dark_gray>[<button-left><reset><dark_gray>]
      <dark_aqua>Pagina <aqua><current-page> <dark_aqua>di <aqua><page-amount> <dark_gray>[<button-right><reset><dark_gray>]<strikethrough>=-------------
    no-page: <prefix><red>Quella pagina non esiste!
    no-results: <prefix><red>Nessun risultato da mostrare.
